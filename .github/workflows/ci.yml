# Gate for pull requests, and the same check on main: the app must typecheck and pass its tests
# before a change merges, and a break that lands on main shows as a red run there.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-typecheck:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
